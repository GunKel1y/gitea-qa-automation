name: Gitea CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  workflow_dispatch:
    inputs:
      xdist_workers:
        description: 'Выберите число воркеров для прогона'
        required: true
        default: '4'
        type: choice
        options:
          - '1'
          - '2'
          - '4'

permissions:
  contents: read

jobs:
  lint:
    name: Запуск линтера Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v6

      - name: Установка Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Установка линтера
        run: pip install "$(grep -i '^ruff==' requirements.txt)"

      - name: Запуск линтера
        run: ruff check .

      - name: Запуск проверки форматирования
        run: ruff format --check --diff .

  tests:
    name: Прогон тестов
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GITEA_ADMIN_LOGIN: ${{secrets.GITEA_ADMIN_LOGIN}}
      GITEA_ADMIN_PASSWORD: ${{secrets.GITEA_ADMIN_PASSWORD}}
      GITEA_ADMIN_EMAIL: ${{secrets.GITEA_ADMIN_EMAIL}}
      DATABASE_NAME: ${{secrets.DATABASE_NAME}}
      DATABASE_USER: ${{secrets.DATABASE_USER}}
      DATABASE_PASSWORD: ${{secrets.DATABASE_PASSWORD}}

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v6

      - name: Скачивание образов gitea и PostgreSQL
        run: docker compose pull -q gitea database

      - name: Сборка образа тестов
        run: docker compose --profile tests build tests

      - name: Запуск Gitea
        run: docker compose up -d --wait gitea

      - name: Запуск тестов
        run: docker compose run --rm tests pytest -n ${{ inputs.xdist_workers || '4' }}

      - name: Сохранение Allure отчета
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: warn
          retention-days: 14

      - name: Логи gitea-init при падении
        if: failure()
        run: docker compose logs --no-log-prefix gitea-init

      - name: Логи Gitea при падении
        if: failure()
        run: docker compose logs --no-log-prefix gitea

      - name: Логи PostgreSQL при падении
        if: failure()
        run: docker compose logs --no-log-prefix database

      - name: Снос контейнеров
        if: always()
        run: docker compose down -v

  allure:
    name: Формирование Allure отчета
    needs: tests
    if: ${{!cancelled() && needs.tests.result != 'skipped'}}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      REPORT_URL: https://${{github.repository_owner}}.github.io/${{github.event.repository.name}}

    steps:
      - name: Скачивание результатов
        uses: actions/download-artifact@v8
        with:
          name: allure-results
          path: allure-results

      - name: Подкладывание истории из прошлого отчета
        run: |
          mkdir -p allure-results/history
          for f in history.json history-trend.json duration-trend.json categories-trend.json retry-trend.json; do
          curl -fsSL --retry 2 -o "allure-results/history/$f" "$REPORT_URL/history/$f" || rm -f "allure-results/history/$f"
          done
          ls allure-results/history

      - name: Установка Allure
        run: npm install -g allure-commandline@2.28.0

      - name: Генерация отчета
        run: allure generate allure-results --clean -o allure-report

      - name: Сохранение отчета артефактом
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report
          retention-days: 14

      - name: Подготовка отчета для Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

  allure_deploy:
    name: Выгрузка Allure отчета на GitHub Pages
    needs: allure
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}

    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Публикация на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5