name: Allure Gitea

on:
  workflow_run:
    workflows: ["Gitea CI"]
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:

  allure:
    name: allure
    if: ${{!cancelled() && needs.tests.result != 'skipped'}}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      REPORT_URL: https://${{github.repository_owner}}.github.io/${{github.event.repository.name}}

    steps:
      - name: Скачивание результатов
        uses: actions/download-artifact@v8
        with:
          name: allure-results
          path: allure-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Подкладывание истории из прошлого отчета
        run: |
          mkdir -p allure-results/history
          for f in history.json history-trend.json duration-trend.json categories-trend.json retry-trend.json; do
          curl -fsSL --retry 2 -o "allure-results/history/$f" "$REPORT_URL/history/$f" || rm -f "allure-results/history/$f"
          done
          ls allure-results/history

      - name: Установка Allure
        run: npm install -g allure-commandline@2.28.0

      - name: Генерация отчета
        run: allure generate allure-results --clean -o allure-report

      - name: Сохранение отчета артефактом
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report
          retention-days: 14

      - name: Подготовка отчета для Pages
        if: ${{ github.event.workflow_run.head_branch == 'main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

  allure-pages:
    name: allure-pages
    needs: allure
    if: ${{ github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}

    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Публикация на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5